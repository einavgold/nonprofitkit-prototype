<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>NonprofitKit Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered question column (560px), widening to 960px for plans, 501(c)(3) and review. Single light theme, per spec palette. */
:root{
  --primary:#1F6F5C; --primary-hover:#185A4A; --tint:#E7F1ED; --tint-strong:#D3E7DF;
  --accent:#F2B84B; --accent-soft:#FCEFD3; --accent-ink:#6B4A0C;
  --bg:#F4F7F5; --surface:#FFFFFF; --text:#1B2420; --muted:#5F6B66; --border:#DCE3DF;
  --success:#2E8B57; --warn-bg:#FFF6E0; --warn:#B7791F; --scrim:rgba(27,36,32,.45);
  --display:"Fraunces", "DM Serif Display", Georgia, "Times New Roman", serif;
  --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
b,strong{font-weight:600}

/* Top bar */
.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:60px;max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--text);background:none;border:0;padding:0;justify-self:start}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center}
.logo-mark svg{width:16px;height:16px}
.sect{font-size:14px;color:var(--muted);white-space:nowrap}
.sect b{color:var(--text);font-weight:600}
.chat{justify-self:end;font-size:14px;font-weight:500;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:6px}
.chat svg{width:16px;height:16px}
.progress{display:flex;gap:6px;max-width:1120px;margin:0 auto;padding:10px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px))}
.seg{flex:1;height:4px;border-radius:4px;background:var(--border);overflow:hidden}
.seg i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .35s ease}

/* Page */
.page{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px 8px}
.col{max-width:560px;margin:0 auto}
.col.wide{max-width:960px}
.qicon{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;margin:8px auto 16px}
.qicon svg{width:26px;height:26px}
h1{font-family:var(--display);font-weight:500;font-size:32px;line-height:1.18;letter-spacing:-.015em;text-align:center;margin:0 0 10px;text-wrap:balance}
h2.q2{font-family:var(--display);font-weight:500;font-size:24px;line-height:1.25;text-align:center;margin:36px 0 16px;text-wrap:balance}
.lede{text-align:center;color:var(--muted);margin:0 auto 24px;max-width:52ch}
.help{font-size:14px;color:var(--muted);margin:6px 0 0}
.center{text-align:center}
.privacy{font-size:14px;color:var(--muted);text-align:center;margin:24px 0 0}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.field label{font-size:14px;font-weight:500}
.input,select.input{width:100%;height:50px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:var(--text)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--tint-strong)}
.phone{position:relative}
.phone .input{padding-left:66px}
.phone .input::placeholder{color:#B4BFBA}
.cc{position:absolute;left:1px;top:1px;bottom:1px;width:60px;border:0;background:none;display:flex;align-items:center;gap:7px;padding:0 0 0 14px;border-radius:10px 0 0 10px}
.cc svg{width:22px;height:15px;border-radius:2px;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.15)}
.cc .caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Cards */
.cards{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin-top:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:15px;font-weight:500;line-height:1.3;transition:border-color .15s, background .15s}
.card:hover{border-color:var(--primary)}
.card .ci{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.card .ci svg{width:22px;height:22px}
.card.sel{border:2px solid var(--primary);background:var(--tint);padding:17px 11px}
.card.sel .ci{background:var(--surface)}

/* Warning + why */
.warn{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:14px 16px;margin-top:20px;font-size:15px;display:flex;gap:10px}
.warn svg{width:20px;height:20px;flex:none;margin-top:2px}
.warn b{color:var(--warn)}
.why{background:var(--tint);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;font-size:15px;margin-top:20px}
.why .sp{width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--primary);display:grid;place-items:center;flex:none}
.why .sp svg{width:15px;height:15px}
.why-h{font-weight:600;font-size:14px;margin-bottom:2px;color:var(--primary)}
.why p{margin:0}

/* Add-on screens */
.body{color:var(--text);margin:0 auto 4px;text-align:center;max-width:52ch}
.pills{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.pill{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:10px 18px;text-align:left;font-size:15px;font-weight:500}
.pill:hover{border-color:var(--primary)}
.pill .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center}
.pill.sel{border:2px solid var(--primary);background:var(--tint);padding:9px 17px}
.pill.sel .rd{border-color:var(--primary)}
.pill.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.pill .pl{flex:1;min-width:0}
.pill .pl small{display:block;font-size:13px;font-weight:400;color:var(--muted);margin-top:2px;line-height:1.35}
.pill:has(small){border-radius:18px}
.chip{display:inline-block;background:var(--accent);color:#3B2A06;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.soft{background:var(--accent-soft);color:var(--accent-ink)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--muted);margin:14px 4px 0}
.note svg{width:15px;height:15px;flex:none;margin-top:2px}
.wyg{margin-top:32px}
.wyg h3{font-family:var(--sans);font-size:14px;font-weight:500;text-align:left;margin:0 0 10px}
.wyg-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wyg-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wyg-card .ci{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.wyg-card .ci svg{width:16px;height:16px}
.wyg-card b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.wyg-card p{margin:3px 0 0;font-size:13px;line-height:1.4;color:var(--muted)}
.explore{margin-top:28px;border-top:1px solid var(--border);padding-top:20px}
.explore summary{list-style:none;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.explore summary::-webkit-details-marker{display:none}
.explore summary svg{width:18px;height:18px;transition:transform .2s}
.explore[open] summary svg{transform:rotate(180deg)}
.explore.static summary{pointer-events:none}
.explore.static summary svg{display:none}
.explore ol{margin:12px 0 0;padding-left:22px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:6px}

/* Bottom bar */
.bar{margin-top:28px}
.bar-in{max-width:560px;margin:0 auto}
.bar-in.wide{max-width:960px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.back{background:none;border:0;color:var(--muted);font-weight:500;padding:10px 4px;font-size:15px}
.back:hover{color:var(--text)}
.primary{background:var(--primary);color:#fff;border:0;border-radius:999px;height:52px;padding:0 30px;font-weight:600;font-size:16px;min-width:160px;transition:background .15s}
.primary:hover:not(:disabled){background:var(--primary-hover)}
.primary:disabled{background:#A9BDB5;color:#F1F5F3}
.primary.block{width:100%}
.strip{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;background:var(--tint);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.strip b{color:var(--primary)}
@media (min-width:720px){.bar.stick{position:sticky;bottom:0;z-index:30;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px}}
.bar-total{display:none}
.under{font-size:13px;color:var(--muted);margin:10px 0 0;text-align:center;line-height:1.5}

footer{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 14px;text-align:center;font-size:13px;color:var(--muted);padding:28px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}

/* Landing */
.hero2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center;margin-top:12px}
.hero-txt{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.hero2 h1{font-size:52px;text-align:left;margin:0 0 6px}
.hero2 .lede{font-size:18px;text-align:left;margin:0 0 18px;max-width:46ch}
.hero2 .primary{height:54px;padding:0 32px;font-size:17px}
.from-line{font-size:13px;color:var(--muted);margin:6px 0 0}
.hero-art{position:relative;align-self:stretch;min-height:240px}
.tree{position:absolute;top:0;bottom:var(--tree-pb,32px);left:50%;transform:translateX(-50%);height:calc(100% - var(--tree-pb,32px));width:auto;max-width:100%;fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.tree .trunk{stroke-width:3}
.tree .leaf path{stroke-width:1.6}
.nfields{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;column-gap:20px;margin-top:24px}
.nfield{display:grid;grid-row:span 3;grid-template-rows:subgrid;row-gap:8px;min-width:0}
.nf-head{display:flex;gap:10px;align-items:flex-start}
.nf-num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.nf-label{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.nf-q{font-size:15px;font-weight:600;line-height:1.3;display:block}
.nfield .help{margin:0}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:44px 0 0}
.trust div{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500}
.trust .ci{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.trust .ci svg{width:18px;height:18px}
.how{margin-top:56px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 16px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.step .num{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;margin-bottom:12px}
.step h3{font-family:var(--display);font-weight:500;font-size:20px;margin:0 0 6px}
.step p{margin:0;font-size:15px;color:var(--muted)}
.arrow{display:grid;place-items:center;color:var(--primary)}
.arrow svg{width:20px;height:20px}
.punch{text-align:center;font-family:var(--display);font-size:20px;margin:24px auto 0;max-width:40ch;text-wrap:balance}
.faq{max-width:720px;margin:56px auto 0}
.faq h2{font-family:var(--display);font-weight:500;font-size:28px;text-align:center;margin:0 0 16px}
.faq details{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px}
.faq summary{list-style:none;padding:16px 18px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:18px;height:18px;flex:none;transition:transform .2s;margin-top:2px}
.faq details[open] summary svg{transform:rotate(180deg)}
.faq details p{margin:0;padding:0 18px 16px;color:var(--muted);font-size:15px}

/* Loader */
.loader{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.spinner{width:48px;height:48px;border-radius:50%;border:4px solid var(--tint-strong);border-top-color:var(--primary);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader h1{margin:0}
.rot{color:var(--muted);min-height:24px}

/* Plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px;align-items:start}
.plan{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.plan.rec{background:linear-gradient(var(--surface),var(--surface)) padding-box}
.plan.sel{border:2px solid var(--primary);padding:21px 19px;box-shadow:0 8px 24px rgba(31,111,92,.10)}
.plan .pn{font-family:var(--display);font-size:24px;font-weight:500}
.plan .pp{font-size:15px;font-weight:600}
.plan .ph{font-size:14px;font-weight:600;color:var(--muted);margin-top:10px}
.nm{text-transform:none;letter-spacing:normal}
.rsec.keepcase>summary,.rsec.keepcase>.rhead{text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}
.plan ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.plan li{display:flex;gap:8px}
.plan li svg{width:16px;height:16px;color:var(--success);flex:none;margin-top:3px}
.plan .chip{position:absolute;top:-11px;left:20px}
.plan .pick{margin-top:12px;font-size:14px;font-weight:600;color:var(--primary);display:flex;align-items:center;gap:8px}
.plan .pick .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center}
.plan.sel .pick .rd{border-color:var(--primary)}
.plan.sel .pick .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.homeline{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border:0;border-radius:var(--radius);padding:12px 16px;font-size:15px;margin:16px auto 0;width:100%;text-align:center}
.homeline:hover{background:#F9E6BC}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px}
.plan-foot{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:20px}

/* 501(c)(3) */
.c3grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px;align-items:start}
.c3grid>*{min-width:0}
.qlist{display:flex;flex-direction:column;gap:12px}
.qrow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.qrow .qt{font-weight:500;font-size:15px;min-width:0}
.qrow .help b{color:var(--text)}
.yn{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;flex:none}
.yn button{border:0;background:none;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.yn button.on{background:var(--primary);color:#fff}
.offer{background:var(--surface);border:2px solid var(--primary);border-radius:16px;padding:22px;margin-top:20px;scroll-margin-top:80px}
.offer.slidein{animation:slidein .4s ease}
@keyframes slidein{from{opacity:0;transform:translateY(18px)}}
.tracker{display:flex;flex-direction:column;gap:6px;width:fit-content;max-width:100%;margin:4px auto 20px}
.tk{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.35}
.tk.done{color:var(--muted)}
.tk.done svg{width:16px;height:16px;color:var(--success);flex:none}
.tk.cur{color:var(--primary);font-weight:600}
.tk.cur small{font-size:12px;font-weight:400}
.tk .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin:0 3px;flex:none}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 18px 4px;margin-top:24px}
.qhelp{font-size:14px;color:var(--muted);margin:14px 0 6px}
.qhelp b{color:var(--text)}
.qrow2{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border)}
.qrow2 .qt{font-size:15px;font-weight:500;min-width:0}
.from{display:inline-block;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:2px 8px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.seg2{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.seg2 button{border:0;background:var(--surface);padding:6px 14px;min-width:54px;font-size:14px;font-weight:600;color:var(--muted)}
.seg2 button+button{border-left:1px solid var(--border)}
.seg2 button.on{background:var(--primary);color:#fff}
.offer h3{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.25;margin:0 0 10px;text-wrap:balance}
.offer p{margin:0 0 10px;font-size:15px}
.offer .facts{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.offer .facts p{margin:0;font-size:14px}
.offer .facts .k{font-weight:600}
.offer .price{font-size:15px;background:var(--tint);border-radius:10px;padding:10px 12px;margin:12px 0 0}
.offer .pills{margin-top:16px}
.offer-tag{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.offer-tag svg{width:14px;height:14px}

/* Review */
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;margin-top:28px;align-items:start}
.rsec{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 20px 14px;margin-bottom:16px}
.rsec>summary,.rsec>.rhead{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0 6px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary{cursor:pointer}
.rsec>summary .sa{font-size:15px;letter-spacing:0;text-transform:none;color:var(--text);display:flex;gap:8px;align-items:center}
.rsec>summary svg{width:18px;height:18px;transition:transform .2s}
.rsec[open]>summary svg{transform:rotate(180deg)}
.sub{font-size:14px;font-weight:600;margin:14px 0 2px;color:var(--text)}

 switch(k){

 }
}

/* ---------- Pricing ---------- */
function calc(){
 const st=stName(), sd=SD(), cm=charityMode(), off=offer(), apply=c3Apply(), plan=val('plan');
 const one=[], yearly=[], monthly=[], fees=[];
 one.push({n:(S.state==='FL'&&!cm)?'Nonprofit Basics (incl. Florida charity exemption filing)':'Nonprofit Basics',a:99,on:true,fixed:true,when:'today'});
 if(off==='C'&&!apply) one.push({n:'501(c)(3)',note:'Not needed yet · you save $424',a:0,on:true});
 else if(apply||S.listed.has('c3')) one.push({n:off==='B'?'501(c)(3) application (full form)':'501(c)(3) application (short form)',a:off==='B'?449:149,on:apply,key:'c3',when:'today'});
 if(val('permits')===true||S.listed.has('permits')) one.push({n:'Permits report',a:39,on:val('permits')===true,key:'permits',when:'today'});
 if(cm&&(val('charity')===true||S.listed.has('charity'))) one.push({n:'Charity registration',a:99,on:val('charity')===true,key:'charity',when:'today'});
 one.push({n:'Expedited state filing',a:39,on:val('expedited')===true,key:'expedited',when:'today'});
 one.push({n:"Founder's kit",a:69,on:val('kit')===true,key:'kit',when:'today'});
 if(val('donation')===true||S.listed.has('donation')) yearly.push({n:'Donation page',a:59,txt:'$59/year',on:val('donation')===true,key:'donation',when:'today'});
 const bk=val('bookkeeping')===true;
 if(bk||S.listed.has('bookkeeping')) monthly.push({n:'Bookkeeping',a:39,txt:'$39/month',on:bk,key:'bookkeeping',when:'when we file'});
 if(sd) sd.fees.forEach(f=>fees.push(f));
 if(cm&&val('charity')===true) fees.push({n:st+' charity registration fee',a:sd.charity.fee});
 const sum=a=>a.filter(x=>x.on).reduce((t,x)=>t+(x.a||0),0);
 const planPrice=PLANS[plan].price;
 const servicesTotal=planPrice+sum(one)+sum(yearly);
 const feesTotal=fees.reduce((t,f)=>t+f.a,0);
 const today=servicesTotal+feesTotal;
 const irs=apply?(off==='B'?600:275):0;
 const stateLater=S.state==='GA'?{when:'Within 90 days',n:'Georgia annual registration',a:40}:S.state==='FL'?{when:'By May 1',n:'Florida annual report',a:61.25}:null;
 const renewal=planPrice+(val('donation')===true?59:0);
 const firstYear=today+irs+(stateLater?stateLater.a:0)+(bk?468:0);
 return {plan,one,yearly,monthly,fees,servicesTotal,feesTotal,today,irs,stateLater,bk,renewal,firstYear,unknownFee:!sd};
}

  bar.innerHTML=`<div class="bar-in ${v.wide&&!mob?'wide':''}">
   ${v.strip?`<div class="strip" id="strip">${v.strip}</div>`:''}
   <div class="bar-row"><button class="back" data-act="back">‹ Back</button>${primary}</div>
   ${v.under?`<p class="under">${v.under}</p>`:''}
   ${scr==='review'&&mob?`<p class="under">${PAY_UNDER}</p>`:''}</div>`;
 }
 bar.classList.toggle('stick',!bar.hidden&&!!v.stick);
 if(lastScreen!==scr){window.scrollTo(0,0);lastScreen=scr;if(S.trail[S.trail.length-1]!==scr)S.trail.push(scr);}
 if(scr==='landing') alignTree();
 renderOv();
}

function go(id){S.screen=id;S.ov=null;render();}
function enterReview(){
 ['c3','donation','charity','permits','bookkeeping'].forEach(k=>{
  const on=k==='c3'?c3Apply():val(k)===true; if(on) S.listed.add(k);
 });
 const p=val('plan'); if(p!=='free') S.listedPlan=p;
}
function next(){
 const f=flow(), i=f.indexOf(S.screen);
 const nx=f[i+1]; if(nx==='review') enterReview(); go(nx);
}
function back(){const f=flow(), i=f.indexOf(S.screen); if(i>0) go(f[i-1]);}

function fillPersona(key){
 const p=PERSONAS[key]; Object.assign(S,p); S.google=false; S.sel={}; S.listed=new Set(); S.listedPlan=null;
 ['donation','charity','permits','bookkeeping'].forEach(k=>{ if(defaults(k)===undefined) S.sel[k]=false; });
 ['q2','q3','q4'].forEach(k=>{ S.sel[k]=false; });
 if(!flow().includes(S.screen)){ // e.g. on the charity screen for a founder who skips it
  const all=SCREENS.map(s=>s.id), f=flow(); let i=all.indexOf(S.screen);
  while(i<all.length&&!f.includes(all[i])) i++; S.screen=all[i];
 }
 if(S.screen==='review') enterReview();
 S.loading=false; S.ov=null; lastScreen=null; render();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]'); if(!t) return;
 const a=t.dataset.act;
 if(a==='scrim'){ if(e.target===t){S.ov=null;renderOv();} return; }
 if(t.tagName==='A') e.preventDefault();
 switch(a){
  case 'home': go('landing'); break;
  case 'chat': break;
  case 'start': go('basics'); break;
  case 'next': if(!t.disabled) next(); break;
  case 'back': back(); break;
  case 'ans': S[t.dataset.key]=t.dataset.val; render(); break;
  case 'pick': {
   let v=t.dataset.val; v=v==='true'?true:v==='false'?false:v;
   const was=S.screen==='c3'&&c3Answered();
   S.sel[t.dataset.key]=v;
   const now=S.screen==='c3'&&c3Answered();
   if(now&&!was) S.revealOffer=true;
   render();
   if(now&&!was&&isMobile()){const o=document.getElementById('offer'); if(o) o.scrollIntoView({behavior:'smooth',block:'start'});}
   break;
  }
  case 'pickplan': S.sel.plan=t.dataset.val; S.ov=null; render(); break;
  case 'tog': {
   const k=t.dataset.key;
   if(k==='plan'){ S.sel.plan=val('plan')===S.listedPlan?'free':S.listedPlan; }
   else if(k==='c3'){ const ck='c3_'+offer(); S.sel[ck]=!c3Apply(); }
   else S.sel[k]=!(val(k)===true);
   render(); break;
  }
  case 'ov': S.ov=t.dataset.ov; renderOv(); break;
  case 'google': S.google=!S.google; render(); break;
  case 'editans': go('cause'); break;
  case 'close': S.ov=null; renderOv(); break;
  case 'paynow': pay(t); break;
  case 'demo': fillPersona(t.dataset.p); break;
 }
});
function pay(btn){
 if(S.paying) return; S.paying=true;
 btn.disabled=true; btn.innerHTML='<span class="btn-spin"></span>';
 setTimeout(()=>{S.paying=false;S.ov=null;go('success');},900);
}
document.addEventListener('submit',e=>{ if(e.target.id==='cardform'){e.preventDefault(); const b=document.getElementById('pay-card'); if(!b.disabled) pay(b);} });
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches('[data-card]')){
  if(t.id==='c-num'){const d=t.value.replace(/\D/g,'').slice(0,16);t.value=d.replace(/(.{4})/g,'$1 ').trim();}
  if(t.id==='c-exp'){const d=t.value.replace(/\D/g,'').slice(0,4);t.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;}
  if(t.id==='c-cvc'||t.id==='c-zip') t.value=t.value.replace(/\D/g,'');
  const ok=[...document.querySelectorAll('[data-card]')].every(i=>i.value.trim().length>=(i.id==='c-num'?15:i.id==='c-exp'?5:i.id==='c-cvc'?3:i.id==='c-zip'?5:i.id==='c-pw'?8:2));
  document.getElementById('pay-card').disabled=!ok; return;
 }
 const k=t.dataset.in; if(!k) return;
 if(k==='phone'){
  const d=t.value.replace(/\D/g,'').slice(0,10);
  t.value=d.length>6?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:d.length>3?`(${d.slice(0,3)}) ${d.slice(3)}`:d;
 }
 S[k]=t.value;
 if(k==='name'){
  const q=document.getElementById('cause-q'); if(q) q.hidden=!S.name.trim();
  document.querySelectorAll('[data-nm]').forEach(x=>x.innerHTML=nm());
 }
 const v=V[S.screen](), b=document.getElementById('btn-next'); if(b) b.disabled=!v.ok;
});
document.addEventListener('change',e=>{ if(e.target.dataset.in==='state'){S.state=e.target.value;const b=document.getElementById('btn-next');if(b)b.disabled=!V[S.screen]().ok;} });
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.ov){S.ov=null;renderOv();}
 if(e.key==='Enter'&&e.target.matches('.input[data-in]')){const b=document.getElementById('btn-next');if(b&&!b.disabled){e.preventDefault();next();}}
});
let wasMobile=isMobile();
window.addEventListener('resize',()=>{const m=isMobile(); if(m!==wasMobile){wasMobile=m; if(!S.loading) render();} if(S.screen==='landing') alignTree();});
// Tree spans from the top of the headline to the bottom of the Start button
function alignTree(){
 const t=document.querySelector('.hero-txt'), b=document.getElementById('btn-start');
 if(!t||!b) return;
 t.parentElement.style.setProperty('--tree-pb',Math.max(0,t.getBoundingClientRect().bottom-b.getBoundingClientRect().bottom)+'px');
}

window.NK={S,calc,flow,go,render,fillPersona,offer,val};
render();
})();
</script>

</body></html>
